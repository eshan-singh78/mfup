name: Build and Release mfup

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v

      - name: Build binary with PyInstaller
        run: |
          pyinstaller --clean --noconfirm mfup.spec

      - name: Smoke test binary
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            ./dist/mfup.exe --version
            ./dist/mfup.exe --help
          else
            ./dist/mfup --version
            ./dist/mfup --help
          fi
        shell: bash

      - name: Package artifact (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir upload
          tar -czvf upload/mfup-${{ github.ref_name }}-linux.tar.gz -C dist mfup

      - name: Package artifact (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir upload
          tar -czvf upload/mfup-${{ github.ref_name }}-macos.tar.gz -C dist mfup

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir upload
          powershell Compress-Archive -Path dist/mfup.exe -DestinationPath upload/mfup-${{ github.ref_name }}-windows.zip

      - name: Upload release binaries
        uses: softprops/action-gh-release@v2
        with:
          files: upload/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
